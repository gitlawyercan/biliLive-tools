name: Build/release Electron app

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      is_tag: ${{ startsWith(github.ref, 'refs/tags/') }}

    strategy:
      matrix:
        # 3.26.1-beta 起：本仓库版本只构建 Windows（win-exe），不再构建 linux/macos 包
        os: [windows-2022]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      # - name: pnpm-update-for-win
      #   if: startsWith(matrix.os, 'windows')
      #   run: node ./scripts/github-ci-pnpm-update.js

      - name: Install dependencies
        run: pnpm ci

      - name: Cache Electron
        uses: actions/cache@v4
        if: runner.os != 'macos'
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/pnpm-lock.yaml')) }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Cache Electron-Builder
        uses: actions/cache@v4
        if: runner.os != 'macos'
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/pnpm-lock.yaml')) }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-cache-

      - name: Install binary deps
        run: pnpm run install:bin

      - name: build
        run: pnpm run build:app

      - name: release
        if: env.is_tag == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifactErrorsFailBuild: false
          # 3.26.1-beta 起：release 只附带 win-exe（安装包 + portable），不含 linux/macos/CLI 包
          artifacts: "packages/app/dist/*.exe"
          replacesArtifacts: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: env.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            packages/app/dist/*.deb
            packages/app/dist/*.snap
            packages/app/dist/*.zip
            packages/CLI/dist/*.zip
            packages/app/dist/*.exe
            packages/app/dist/*.zip
            packages/CLI/dist/*.zip
            packages/CLI/dist/*.zip
            packages/app/dist/*.dmg

permissions:
  contents: write
